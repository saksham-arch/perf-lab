[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perf-lab"
version = "0.1.0"
description = "Utilities for repeatable performance experiments"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
perf-lab = "perf_lab.__main__:main"

